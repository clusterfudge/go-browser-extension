<!DOCTYPE html>
<html>

<head>
  <title>Trotto Options</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 16px;
      min-width: 300px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      padding: 8px 16px;
      margin-right: 8px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #save {
      background-color: #4285f4;
      color: white;
    }
    #save:hover {
      background-color: #3367d6;
    }
    #reset {
      background-color: #f1f3f4;
      color: #5f6368;
    }
    #reset:hover {
      background-color: #e8eaed;
    }
    #status {
      margin-top: 12px;
      padding: 8px;
      border-radius: 4px;
    }
    #status.success {
      background-color: #e6f4ea;
      color: #137333;
    }
    #status.error {
      background-color: #fce8e6;
      color: #c5221f;
    }
  </style>
</head>

<body>
  <label for="instance_url">Instance URL</label>
  <input type="text" id="instance_url" name="instance_url" placeholder="https://trot.to">
  <button id="save">Save</button>
  <button id="reset">Reset default</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
